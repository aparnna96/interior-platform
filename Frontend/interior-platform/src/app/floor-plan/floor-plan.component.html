<div class="plan-outer">
  <div class="dim dim-top" aria-hidden="true">
    <span class="dl"></span><span class="dlab">{{ width }} ft</span><span class="dl"></span>
  </div>
  <div class="plan-row">
    <div class="dim dim-side" aria-hidden="true">
      <span class="dl"></span><span class="dlab">{{ length }} ft</span><span class="dl"></span>
    </div>
    <div class="plan-scale">
      <div
        class="plan"
        [style.aspect-ratio]="aspect"
        [ngStyle]="planStyle"
        [style.--wall]="wall"
        [style.--floor]="floor"
        [style.--fabric]="fabric"
        [style.--accent]="accent"
        [attr.data-light]="light"
        [attr.data-floor]="floorCode"
        role="img"
        [attr.aria-label]="'Room plan, ' + width + ' by ' + length + ' feet, area ' + area + ' square feet'"
      >
        <div class="floor-tex" aria-hidden="true"></div>
        <div class="plan-grid" aria-hidden="true"></div>
        <!-- subtle static architectural indicators (no data model) -->
        <div class="win" aria-hidden="true"><span></span></div>
        <svg class="door" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="14" y="30" width="26" height="6" class="door-gap" />
          <path d="M14 36 L14 8" class="door-leaf" />
          <path d="M14 36 A28 28 0 0 1 42 36" class="door-arc" />
        </svg>
        @for (item of items; track item.uid) {
          <button
            class="f-item"
            [class.selected]="selectedId === item.uid"
            [style.left.%]="item.x"
            [style.top.%]="item.y"
            [style.width.%]="wPct(item)"
            [style.height.%]="hPct(item)"
            (click)="select.emit(item.uid)"
            [title]="item.name + ' · ' + item.w + '×' + item.l + ' ft'"
            [attr.aria-label]="item.name + ', ' + item.w + ' by ' + item.l + ' feet'"
            [attr.aria-pressed]="selectedId === item.uid"
          >
            @if (item.defId === 'sofa') {
              <svg class="f-graphic" viewBox="0 0 70 30" preserveAspectRatio="none" aria-hidden="true">
                <rect x="2" y="3.5" width="66" height="25" rx="5" class="g-shadow" />
                <rect x="1" y="1.5" width="68" height="27" rx="6" class="g-frame" />
                <rect x="9" y="4.5" width="25" height="7" rx="2.5" class="g-cushion" />
                <rect x="36" y="4.5" width="25" height="7" rx="2.5" class="g-cushion" />
                <rect x="9" y="13.5" width="25" height="11" rx="2.5" class="g-seat" />
                <rect x="36" y="13.5" width="25" height="11" rx="2.5" class="g-seat" />
                <rect x="2.5" y="5" width="4.5" height="19" rx="2" class="g-arm" />
                <rect x="63" y="5" width="4.5" height="19" rx="2" class="g-arm" />
              </svg>
            } @else if (item.defId === 'table') {
              <svg class="f-graphic" viewBox="0 0 40 25" preserveAspectRatio="none" aria-hidden="true">
                <rect x="2" y="3" width="36" height="20" rx="7" class="g-shadow" />
                <rect x="1" y="1.5" width="38" height="22" rx="8" class="g-frame" />
                <rect x="5" y="5.5" width="30" height="14" rx="5" class="g-inset" />
                <circle cx="7" cy="7.5" r="1.5" class="g-leg" />
                <circle cx="33" cy="7.5" r="1.5" class="g-leg" />
                <circle cx="7" cy="17.5" r="1.5" class="g-leg" />
                <circle cx="33" cy="17.5" r="1.5" class="g-leg" />
              </svg>
            } @else if (item.defId === 'bed') {
              <svg class="f-graphic" viewBox="0 0 65 50" preserveAspectRatio="none" aria-hidden="true">
                <rect x="2" y="3" width="61" height="45" rx="3" class="g-shadow" />
                <rect x="1" y="1.5" width="63" height="47" rx="3" class="g-frame" />
                <rect x="1" y="1.5" width="63" height="7" class="g-head" />
                <rect x="6" y="11.5" width="53" height="34" rx="2" class="g-mattress" />
                <rect x="9" y="13.5" width="22" height="9" rx="2" class="g-pillow" />
                <rect x="34" y="13.5" width="22" height="9" rx="2" class="g-pillow" />
                <line x1="6" y1="31" x2="59" y2="31" class="g-fold" />
              </svg>
            } @else if (item.defId === 'wardrobe') {
              <svg class="f-graphic" viewBox="0 0 60 20" preserveAspectRatio="none" aria-hidden="true">
                <rect x="2" y="3" width="56" height="15" rx="1.5" class="g-shadow" />
                <rect x="1" y="1.5" width="58" height="17" rx="1.5" class="g-carcass" />
                <line x1="20.5" y1="2.5" x2="20.5" y2="17.5" class="g-panel" />
                <line x1="40" y1="2.5" x2="40" y2="17.5" class="g-panel" />
                <line x1="17.5" y1="8" x2="17.5" y2="12" class="g-handle" />
                <line x1="23.5" y1="8" x2="23.5" y2="12" class="g-handle" />
                <line x1="37" y1="8" x2="37" y2="12" class="g-handle" />
                <line x1="43" y1="8" x2="43" y2="12" class="g-handle" />
              </svg>
            } @else {
              <svg class="f-graphic" viewBox="0 0 25 25" preserveAspectRatio="none" aria-hidden="true">
                <rect x="3.5" y="4" width="18" height="19" rx="4" class="g-shadow" />
                <rect x="3" y="2" width="19" height="6.5" rx="3" class="g-back" />
                <rect x="4" y="9.5" width="17" height="12" rx="4" class="g-seat" />
                <circle cx="7.5" cy="12.5" r="1.2" class="g-leg" />
                <circle cx="17.5" cy="12.5" r="1.2" class="g-leg" />
                <circle cx="7.5" cy="18.5" r="1.2" class="g-leg" />
                <circle cx="17.5" cy="18.5" r="1.2" class="g-leg" />
              </svg>
            }
            <span class="sel-ring" aria-hidden="true"></span>
            <span class="f-label" aria-hidden="true"><b>{{ item.name }}</b><em>{{ item.w }} × {{ item.l }} ft</em></span>
          </button>
        }
        @if (items.length === 0) {
          <div class="plan-empty">
            <p>Empty room · {{ area }} sq ft</p>
            <span>Add furniture from the Furniture panel</span>
          </div>
        }
        <div class="plan-veil" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <p class="hint">Plan scales proportionally · 1 grid square ≈ 1 ft · furniture sized in feet</p>
</div>
